# Production stack that runs the images published to GHCR by
# .github/workflows/docker-publish.yml. Nothing is compiled on the host, so it
# works with plain Docker Compose on any server (VPS, home server, NAS, ...)
# and can be imported as a custom app in CasaOS.
#
#   cp .env.example .env   # then set POSTGRES_PASSWORD and APP_ORIGIN
#   docker compose --env-file .env -f compose.prod.yaml up -d
#
# Required variables: POSTGRES_PASSWORD and APP_ORIGIN.
# APP_ORIGIN must be the exact URL the browser uses, e.g. http://192.168.1.50:8090
# The image references and the published port are literal on purpose: CasaOS's
# importer cannot parse ${...} inside `image:` or `ports:`. Change them here if
# you need a different tag, registry or host port.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: personal_life
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_life"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot job: applies embedded Goose migrations, then exits 0.
  # It re-runs on every `up` and is idempotent; the API waits for it.
  migrate:
    image: ghcr.io/danielpereod/vindolanda-api:latest
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/personal_life?sslmode=disable
    # `links` keeps name resolution working when CasaOS forces network_mode: bridge.
    links:
      - postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/danielpereod/vindolanda-api:latest
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/personal_life?sslmode=disable
      APP_ORIGIN: ${APP_ORIGIN}
      LISTEN_ADDR: 0.0.0.0:8080
      # Set to true only behind HTTPS (reverse proxy).
      COOKIE_SECURE: "false"
      INITIAL_USERNAME: owner
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      OPENFOODFACTS_USER_AGENT: personal-life/0.1
    links:
      - postgres
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    image: ghcr.io/danielpereod/vindolanda-web:latest
    links:
      - api
    depends_on:
      api:
        condition: service_started
    ports:
      - "8090:80"
    restart: unless-stopped

volumes:
  postgres_data:
