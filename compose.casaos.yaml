# Production stack for self-hosting (CasaOS, Docker Compose).
#
# It pulls the images built automatically by GitHub Actions from GHCR; nothing
# is compiled on the server. Use it from its own directory with a `.env` file
# (see `.env.example`):
#
#   docker compose --env-file .env -f compose.casaos.yaml pull
#   docker compose --env-file .env -f compose.casaos.yaml up -d
#
# Required variables: POSTGRES_PASSWORD and APP_ORIGIN.
# APP_ORIGIN must be the exact URL the browser uses, e.g. http://192.168.1.50:8090
# If you serve the app over plain HTTP, set COOKIE_SECURE=false; set it to true
# only behind HTTPS (reverse proxy).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_life}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-personal_life}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot job: applies embedded Goose migrations, then exits 0.
  # It re-runs on every `up` and is idempotent; the API waits for it.
  migrate:
    image: ghcr.io/danielpereod/vindolanda-api:${IMAGE_TAG:-latest}
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-personal_life}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/danielpereod/vindolanda-api:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-personal_life}?sslmode=disable
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      LISTEN_ADDR: 0.0.0.0:8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      INITIAL_USERNAME: ${INITIAL_USERNAME:-owner}
      OPENFOODFACTS_USER_AGENT: ${OPENFOODFACTS_USER_AGENT:-personal-life/0.1}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    image: ghcr.io/danielpereod/vindolanda-web:${IMAGE_TAG:-latest}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8090}:80"
    restart: unless-stopped

volumes:
  postgres_data:
